# Part C 가설: 온도·추론(또는 모델)을 바꾸면 질문을 분석할 여지가 늘어, 근거가 검색됐는데도 거절하던 답변을
# 거절하지 않고 답할 것이다 (오거절률 하락, 유용성 상승, 안전성 유지 기대). 생성 설정만 바꾸고 골드셋·judge·인덱스는 고정.
# 실험 B: 추론의 효과. Luna, 추론 none -> medium. 추론을 켜면 API가 온도를 기본값 1로만 허용한다
# (0.5는 400 오류, 2026-10-02 실측). 그래서 이 실험은 온도 0 -> 1도 함께 바뀐다 (A와 비교해 가른다)
[settings]
llm_reasoning_effort = "medium"
