# Part C 실험 5 가설: 실험 1~4에서 나온 개선점을 모두 적용하면 기존 첫 설정(기준선)보다 성능이 좋아질 것이다.
# 코드 수준에서 바로 고칠 수 있는 것만 합친다 (하이브리드 검색·rerank는 리소스 부족으로 제외).
# - 생성: Luna + 추론 medium (실험 1의 B, 온도는 API 기본값 1)
# - 프롬프트: v3 = v2(실험 4) + 상황 적용 때 시행일 확인 (실험 4의 실제 오답 qual-11 대응)
# - 검색: top_k 5, 범용 분할 그대로 (실험 2·3에서 개선으로 보지 않음)
# - eval: 판정 문구 judge-ko-v2 (유보 문장을 출처에 정말 없는지로 판정). 기준선도 같은 문구로 다시 판정해 비교한다
[settings]
llm_reasoning_effort = "medium"
rag_prompt = "v3"
judge_template = "judge-ko-v2"
