[project]
name = "rag-qa-eval"
version = "0.1.0"
description = "Citation RAG QA service and eval harness over a Korean public policy corpus"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
