version: '1.0'
project:
  description: 모든 작업 결과를 빠짐없이 커밋하고, 각 커밋은 하나의 논리적 변경만 포함하는 원자적 커밋으로 관리한다.
  stacks: []
rules:
  - id: always-commit
    title: 모든 작업 변경사항 커밋
    content: |
      ## 커밋 필수 규칙
      - 작업으로 생성하거나 수정한 모든 추적 대상 파일은 작업 종료 전에 커밋한다.
      - 작업 종료 전 `git status`를 확인하고 의도하지 않은 미커밋 변경사항을 남기지 않는다.
      - 임시 파일, 비밀정보, 빌드 산출물은 커밋하지 않는다.
      - 검증에 실패한 변경사항은 커밋하지 않는다.
    priority: 10
  - id: atomic-commits
    title: 원자적 커밋
    content: |
      ## 원자적 커밋 규칙
      - 각 커밋은 하나의 독립적인 논리적 변경만 포함해야 한다.
      - 서로 관련 없는 기능, 리팩터링, 포맷 변경, 문서 변경을 하나의 커밋에 섞지 않는다.
      - 구현과 해당 구현에 직접 대응하는 테스트는 같은 커밋에 포함할 수 있다.
      - 커밋 전에 staged diff를 검토하고 부분적으로 완료된 변경이나 디버깅 코드를 제거한다.
      - 커밋 메시지는 변경 목적을 명확하고 간결하게 설명해야 한다.
    priority: 11
enforcement:
  preCommit: []
  blockedPaths: []
  blockedCommands: []
  postSave: []
hooks:
  - block: branch-guard
    params:
      mainBranch: main
    mode: block
  - block: no-verify-guard
    params: {}
    mode: block
  - block: force-push-guard
    params:
      protected: main,master
      allowLease: true
    mode: block
  - block: semantic-diff-gate
    params:
      rules:
        - Each commit must contain exactly one cohesive logical change.
        - Do not mix unrelated features, refactoring, formatting, documentation, or maintenance changes in one commit.
        - Do not commit temporary files, secrets, build artifacts, debugging code, or partially completed changes.
      threshold: 0.85
      jgrep: jgrep
    mode: block
  - block: stop-uncommitted-warn
    params: {}
    mode: block
  - block: config-audit
    params: {}
    mode: block
  - block: harness-guard
    params: {}
    mode: block
loop:
  enabled: true
  ledger: WORKPLAN.md
  workOrders: docs/work-orders
  model: sonnet
  sentinel: OMH_GOAL_COMPLETE
  interval: 120
  blockedBackoff: 1800
  limitBackoff: 1800
  emptyBackoff: 300
  stallStreak: 3
  turnTimeout: 7200
  architectOnly: []
  isolate: true
  runtime: claude
permissions:
  allow:
    - Bash(git status*)
    - Bash(git diff*)
    - Bash(git add*)
    - Bash(git restore*)
    - Bash(git commit*)
    - Bash(git log*)
    - Bash(git show*)
  deny:
    - Bash(git commit --no-verify*)
    - Bash(git commit -n*)
    - Bash(git push --no-verify*)
    - Bash(git push -n*)
    - Bash(git push --force*)
    - Bash(git push -f*)
    - Bash(git reset --hard*)
    - Bash(rm -rf /)
